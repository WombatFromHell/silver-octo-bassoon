theme = "catppuccin_mocha"

[editor]
line-number = "relative"
mouse = true
auto-completion = true
auto-format = true
[editor.indent-guides]
render = true
character = "⸽"
skip-levels = 1

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.lsp]
display-inlay-hints = true
auto-signature-help = true
