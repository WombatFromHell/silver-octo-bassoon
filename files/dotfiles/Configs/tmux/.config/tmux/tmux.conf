# ==================================================
# tmux.conf — main config entry point
# ==================================================
# The config is split into per-section modules under
# ~/.config/tmux/conf.d/, sourced in order:
#
#   01-env.conf        environment & PATH resolution
#   02-core.conf       core terminal settings + bell notifications
#   03-keys.conf       keybindings
#   04-statusbar.conf  status bar (palette, blocks, refresh loop)
#   05-floax.conf      floax floating pane (tab bar)

source-file ~/.config/tmux/conf.d/01-env.conf
source-file ~/.config/tmux/conf.d/02-core.conf
source-file ~/.config/tmux/conf.d/03-keys.conf
source-file ~/.config/tmux/conf.d/04-statusbar.conf
source-file ~/.config/tmux/conf.d/05-floax.conf
