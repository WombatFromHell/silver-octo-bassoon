# ==========================================
# 1. ENVIRONMENT & PATH RESOLUTION (FIRST)
# ==========================================
# Dynamically build PATH so nix/homebrew/system binaries resolve in tmux
run-shell '
  P=""
  [ -d "$HOME/.nix-profile/bin" ]          && P="$HOME/.nix-profile/bin:$P"
  [ -d "/opt/homebrew/bin" ]               && P="/opt/homebrew/bin:$P"
  [ -d "/usr/local/bin" ]                  && P="/usr/local/bin:$P"
  [ -d "/home/linuxbrew/.linuxbrew/bin" ]  && P="/home/linuxbrew/.linuxbrew/bin:$P"
  tmux set-environment -g PATH "${P}${PATH}"
  if [ -x "$HOME/.nix-profile/bin/fish" ]; then F="$HOME/.nix-profile/bin/fish"
  elif [ -x "/usr/local/bin/fish" ]; then F="/usr/local/bin/fish"
  elif [ -x "/opt/homebrew/bin/fish" ]; then F="/opt/homebrew/bin/fish"
  elif [ -x "/home/linuxbrew/.linuxbrew/bin/fish" ]; then F="/home/linuxbrew/.linuxbrew/bin/fish"
  else F="$(command -v fish 2>/dev/null || echo /bin/sh)"; fi
  tmux set-option -g default-shell "$F"
'

# ==========================================
# 2. CORE PERFORMANCE & TERMINAL SETTINGS
# ==========================================
set -g escape-time 0
set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -g set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1
set -g history-limit 100000
set -g status-interval 5
set -g display-time 4000
set -g focus-events on
set -g mouse on
set-option -g status-position top
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{pane_title}'
# Forward the active pane's title to the outer terminal (kitty/ghostty),
# so the OS window title tracks the selected pane instead of falling
# back to the foreground process name.
set -g set-titles on
set -g set-titles-string "#{session_name}:#{window_index} #T"
set -g window-size latest
setw -g aggressive-resize on

#
# AGENT COMPLETION BELL NOTIFICATIONS
#
# Enable bell monitoring across all windows
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# Focus tracking (ignore the floax popup's own client)
set -g @term_focused 1
set-hook -g client-focus-out {
  if -F '#{!=:#{session_name},floax}' { set -g @term_focused 0 }
}
set-hook -g client-focus-in {
  if -F '#{!=:#{session_name},floax}' {
    set -g @term_focused 1
    run-shell "tmux set -uw -w -t #{window_id} @bell; tmux set -gu @bell"
  }
  refresh-client -S
}
# Acknowledge the bell on the selected window (per-window @bell, set by bell.sh)
set-hook -g session-window-changed {
  run-shell -b "w=$(tmux display-message -p #{window_id}); tmux set -uw -w -t \"$w\" @bell"
  refresh-client -S
}

# Bell: delegate to bell.sh (sound + one dot per tab period; floax -> @floax_bell)
set-hook -g alert-bell {
  run-shell -b "~/.config/tmux/bell.sh '#{hook_window}' '#{session_name}' '#{window_active}' '#{@term_focused}' '#{session_attached}'"
}

# ==========================================
# 3. KEYBINDINGS
# ==========================================
# Set leader to Ctrl-S
set -g prefix C-s

# Reload config with <leader>r (also clears any stale per-window @bell dots)
bind r source-file ~/.tmux.conf \; run-shell -b 'tmux set -gu @bell; for w in $(tmux list-windows -t #{session_name} -F "#{window_id}"); do tmux set -uw -w -t "$w" @bell; done' \; display-message "Config reloaded!"

# Pre-defined splits
bind-key v split-window -h -l 40% -c "#{pane_current_path}"
bind-key s split-window -v -l 30% -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# New window inherits the current pane's path
bind-key c new-window -c "#{pane_current_path}"
# Reorder windows with < and >
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1

# Vi-mode keybindings
set -g status-keys vi
set-window-option -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -T copy-mode-vi 'v' send -X begin-selection
# Floax panes are tmux popups, where tmux drops OSC 52 (tmux#4797);
# copy-pipe runs in the tmux server so the system clipboard works in popups too
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'if command -v wl-copy >/dev/null; then wl-copy; elif command -v pbcopy >/dev/null; then pbcopy; else xclip -selection clipboard -in; fi'
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'if command -v wl-copy >/dev/null; then wl-copy; elif command -v pbcopy >/dev/null; then pbcopy; else xclip -selection clipboard -in; fi'

# Natural scrolling with PgUp/PgDn in copy mode
bind-key -T copy-mode-vi PageUp send-keys -X page-up
bind-key -T copy-mode-vi PageDown send-keys -X page-down
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down

# Alt-arrows to switch panes without prefix
bind-key -n M-Left select-pane -L
bind-key -n M-Down select-pane -D
bind-key -n M-Up select-pane -U
bind-key -n M-Right select-pane -R

# Ctrl-Alt-h/j/k/l: force pane navigation (overrides vim's own hjkl)
bind-key -n C-M-h select-pane -L
bind-key -n C-M-j select-pane -D
bind-key -n C-M-k select-pane -U
bind-key -n C-M-l select-pane -R

# Alt-h/Alt-l to switch windows without prefix
bind-key -n M-h previous-window
bind-key -n M-l next-window

# Resize with Alt-Shift HJKL
bind-key -n M-J resize-pane -D 5
bind-key -n M-K resize-pane -U 5
bind-key -n M-H resize-pane -L 5
bind-key -n M-L resize-pane -R 5

# Toggle local keybindings on/off with F12
bind -n F12 \
    set prefix None \; \
    set key-table off \; \
    set status-style "fg=color245,bg=color238" \; \
    refresh-client -S

bind -T off F12 \
    set -u prefix \; \
    set -u key-table \; \
    set -u status-style \; \
    refresh-client -S

# ==========================================
# 4. STATUS BAR (native, catppuccin-mocha + teal accent)
# ==========================================
set -g status-style "bg=#1e1e2e,fg=#a6adc8"
# Message/prompt overlay (tmux 3.6+): muted, not the default bright orange.
# No fill -> it only covers the message text, not the whole bar.
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g status-left-length 100
set -g status-right-length 60

# Single status line: left block + right block, no default window list.
set -g status-format[0] "#[align=left range=left]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[nolist align=right range=right]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# ── Catppuccin Mocha palette (composable) ──
set -g @c_base  '#1e1e2e'
set -g @c_s0    '#313244'
set -g @c_s1    '#45475a'
set -g @c_o1    '#7f849c'
set -g @c_o2    '#a6adc8'
set -g @c_t1    '#cdd6f4'
set -g @c_t2    '#bac2de'
set -g @c_m     '#6c7086'
set -g @c_blu   '#89b4fa'
set -g @c_grn   '#a6e3a1'
set -g @c_teal  '#94e2d5'
set -g @c_red   '#f38ba8'

# Copy-mode selection + mode line: teal, matching the "selected" state
set -g mode-style "fg=#{@c_base},bg=#{@c_teal}"

# Active pane border: teal, matching the "selected" state
set -g pane-active-border-style "fg=#{@c_teal}"

# Left: session name in a teal block, running process in a surface1
# block, then square tabs. Selected tab = index in a teal square +
# path in surface1; unselected = number only on a muted grey block.
# (no commas inside #[...] — they would break the #{?} split)
# #[range=window|N] makes each tab clickable (MouseUp1Status ->
# switch-client), as in tmux's built-in default status-format.
set -g status-left " #[bg=#{@c_teal}]#[fg=#{@c_base}]  #{session_name}#{?#{@floax_bell},#[fg=#{@c_red}]  ,} #[default] #[bg=#{@c_s1}]#[fg=#{@c_t1}] #{pane_current_command} #[default] #{W:#[range=window|#{window_index}]#{?#{==:#{window_index},1},,#[default] }#{?#{==:#{window_active},1},#[bg=#{@c_teal}]#[fg=#{@c_base}] #I #[bg=#{@c_s1}]#[fg=#{@c_t1}] #{pane_title}#{?#{@bell}, #[fg=#{@c_red}]●,} #[default],#[bg=#{@c_s0}]#[fg=#{@c_o1}] #I#{?#{@bell}, #[fg=#{@c_red}]●,} }}"

# Clock format: '24' (19:19) or '12' (7:19 PM). Toggle at runtime:
#   tmux set -g @clock-format 12
set -g @clock-format '24'

# GPU%/VRAM% and CPU%/RAM% blocks — populated by statusbar.sh global env
# vars; each group hidden until its vars are first set (no [%/%] flash).
# Then a short date block (󰖬, month.day) and a clock block ( ) using
# @clock-format, with the muted | between them inside the s0 block, like
# the GPU/CPU blocks. status-right is strftime-expanded, so %m.%d / %H:%M
# are literal.
set -g status-right "#{?#{==:#{q:GPU_UTIL},},,#[bg=#{@c_s0}] #[fg=#{@c_t1}]󰘚#[fg=#{@c_o2}] #{q:GPU_UTIL}%#[fg=#{@c_m}]|#[fg=#{@c_o2}]#{q:VRAM}% #[default]} #{?#{==:#{q:CPU},},,#[bg=#{@c_s0}] #[fg=#{@c_t1}]#[fg=#{@c_o2}] #{q:CPU}%#[fg=#{@c_m}]|#[fg=#{@c_o2}]#{q:RAM}% #[default]} #[bg=#{@c_s0}] #[fg=#{@c_t1}] #[fg=#{@c_o2}]%m.%d #[fg=#{@c_m}]|#[default]#[bg=#{@c_s0}]#[fg=#{@c_t1}]  #[fg=#{@c_o2}]#{?#{==:#{q:@clock-format},12},%I:%M %p,%H:%M} #[default]"

# Background loop refreshing GPU/CPU/RAM values (flock-guarded, reload-safe)
run -b 'bash ~/.config/tmux/statusbar.sh'

# ==========================================
# 5. FLOAX-LIKE FLOATING PANE (INLINED)
# ==========================================
# M-p toggles a floating popup hosting a persistent 'floax' session.
# Single-pane by design: open from any session, close from within.
# The pane survives close/reopen (it's a real session, not a throwaway).
bind -n M-p run-shell '
  s=floax
  if [ "$(tmux display-message -p "#{session_name}")" = "$s" ]; then
    # inside the popup -> detach closes it (pane persists)
    tmux detach-client
  else
    tmux has-session -t "$s" 2>/dev/null || {
      tmux new-session -d -s "$s" -c "#{pane_current_path}"
      tmux set-option -t "$s" status off
    }
    tmux set -gu @floax_bell
    tmux display-popup -E -w 80% -h 80% -b rounded -T floax \
      "tmux attach-session -t $s"
  fi
'
