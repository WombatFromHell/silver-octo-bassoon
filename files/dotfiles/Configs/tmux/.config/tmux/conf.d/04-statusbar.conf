# ==========================================
# 4. STATUS BAR (native, catppuccin-mocha + teal accent)
# ==========================================
set -g status-style "bg=#1e1e2e,fg=#a6adc8"
# Message/prompt overlay (tmux 3.6+): muted, not the default bright orange.
# No fill -> it only covers the message text, not the whole bar.
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g status-left-length 100
set -g status-right-length 120

# Single status line: left block + right block, no default window list.
set -g status-format[0] "#[align=left range=left]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[nolist align=right range=right]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# ── Catppuccin Mocha palette (composable) ──
set -g @c_base  '#1e1e2e'
set -g @c_s0    '#313244'
set -g @c_s1    '#45475a'
set -g @c_o1    '#7f849c'
set -g @c_o2    '#a6adc8'
set -g @c_t1    '#cdd6f4'
set -g @c_t2    '#bac2de'
set -g @c_m     '#6c7086'
set -g @c_blu   '#89b4fa'
set -g @c_grn   '#a6e3a1'
set -g @c_teal  '#94e2d5'
set -g @c_red   '#f38ba8'

# Copy-mode selection + mode line: teal, matching the "selected" state
set -g mode-style "fg=#{@c_base},bg=#{@c_teal}"

# Active pane border: teal, matching the "selected" state
set -g pane-active-border-style "fg=#{@c_teal}"
# Inactive pane borders + popup (floax) chrome: tmux 3.8 moved these defaults
# to the new 'theme' colours (generic greys), so pin them to the palette.
set -g pane-border-style "fg=#{@c_m}"
set -g popup-style "bg=#{@c_base},fg=#{@c_t1}"
set -g popup-border-style "fg=#{@c_teal}"

# ── Composable status-left blocks ──────────────────────────────────────

# Define foreground processes to hide (POSIX Extended Regex)
set -g @sl_command_ignore "^(bash|zsh|fish|tmux)$"

# Show the session name block
set -g @sl_session "\
#[bg=#{@c_teal}]#[fg=#{@c_base}]  #{session_name}#{?#{@floax_bell},#[fg=#{@c_red}]  ,} #[default]"

# Show the foreground procname block (conditionally hidden via @sl_command_ignore)
set -g @sl_command "\
#{?#{m/r:#{@sl_command_ignore},#{pane_current_command}},, #[bg=#{@c_s1}]#[fg=#{@c_t1}] #{pane_current_command} #[default]}"

# Show our custom tab bar (index and pane title for active, index only for inactive).
# Uniform 2sp gap between tabs: each chip carries one leading and one trailing
# space (the trailing one doubles as the right margin after the last tab).
# The bell is a composable unit: a leading space + red dot, referenced once here
# per branch via @sl_tab_bell, so the styling lives in one place.
set -g @sl_tab_bell ' #[fg=#{@c_red}]●'
 
set -g @sl_gap_pad "#[bg=#{@c_base}] "
set -g @sl_windows_fmt "\
#{W:#[range=window|#{window_index}]#{?#{==:#{window_active},1},\
#{?#{window_start_flag},,#{E:@sl_gap_pad}}#[bg=#{@c_teal}]#[fg=#{@c_base}] #I \
#[bg=#{@c_s1}]#[fg=#{@c_t1}] #{pane_title}#{?#{@bell},#{@sl_tab_bell},} #[default],\
#{?#{window_start_flag},,#{E:@sl_gap_pad}}#[bg=#{@c_s0}]#[fg=#{@c_o1}] #I#{?#{@bell},#{@sl_tab_bell},} }}"

# Compose final status-left section
run-shell 'tmux set -g status-left "#{@sl_session}#{@sl_command} #{@sl_windows_fmt}"'

# Clock format: '24' (19:19) or '12' (7:19 PM). Toggle at runtime:
#   tmux set -g @clock-format 12
set -g @clock-format '24'


# ── Status Right: pull model (#()) ───────────────────────────────────────
# tmux runs the one-shot script as a background job on every status draw
# (status ticks AND job-completion redraws) and inserts its last output
# line verbatim: no strftime (script emits single %), `#[...]` styles
# honored, no `#{}`. The script paces itself to at most one pull per
# status-interval (see scripts/statusbar.sh) and composes the metric
# blocks + time block (calendar+clock) there: the time block is static,
# rendered at pull time via date(1) with the @clock-format value read
# live per pull (so runtime toggles are followed). Pre-data (first pull,
# no state): bare muted clock, no calendar/date/separator.
set -g status-right "#(bash ~/.config/tmux/scripts/statusbar.sh)"
