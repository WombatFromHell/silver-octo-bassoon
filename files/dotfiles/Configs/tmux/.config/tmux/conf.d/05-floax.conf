# ==========================================
# 5. FLOAX-LIKE FLOATING PANE (self-contained; no plugin manager)
# ==========================================
# M-p opens a modal FLOATING pane (display-popup) that runs a NESTED
# `tmux attach-session -t floax`. The nested client is attached to the
# persistent `floax` session and renders its status bar (the tab bar).
#
# Why tabs are keyboard-driven, not mouse-driven:
#   The floating pane is flagged PANE_CAPTUREALLKEYS, which forwards NON-mouse
#   keys into the nested client (so typing works in the popup). Mouse keys are
#   NEVER forwarded — the outer tmux binds them instead. So the nested client
#   that renders the floax tab bar never receives mouse events, and
#   #[range=window|...] clicks can't switch floax windows. Tabs therefore
#   switch with the global window bindings M-h / M-l, which DO reach the
#   nested floax client and move its active window. The tab bar is a visual
#   indicator of which floax window is active.

# Configure the floax session on creation. (Hook, not run-shell: run-shell
# format-expands its command, which would freeze the #{W:} tab list.)
set-hook -g session-created {
  if -F '#{==:#{session_name},floax}' {
    set -t floax status off
    set -t floax status-right ""
    set -t floax status-left " #{W:#[range=window|#{window_index}]#{?#{==:#{window_active},1},#[bg=#{@c_teal}]#[fg=#{@c_base}] #I #{window_name}#{?#{@bell}, #[fg=#{@c_red}]●,} #[default],#[bg=#{@c_s0}]#[fg=#{@c_o1}] #I#{?#{@bell}, #[fg=#{@c_red}]●,} }}"
  }
}

# Show the tab bar only while floax has more than one window.
#   window-linked   -> a window was ADDED
#   window-unlinked -> a window was REMOVED (killed, shell exited, or moved out).
#   Hooks run after the window list is updated, so session_windows is already
#   correct in both. (window-closed is tmux-master only: avoid it, it is an
#   "invalid option" on 3.7b and older.)
set-hook -g window-linked {
  if -F '#{==:#{session_name},floax}' {
    if -F '#{>:#{session_windows},1}' 'set -t floax status on' 'set -t floax status off'
  }
}
set-hook -g window-unlinked {
  if -F '#{==:#{session_name},floax}' {
    if -F '#{>:#{session_windows},1}' 'set -t floax status on' 'set -t floax status off'
  }
}

# M-p toggles the pseudo-floating floax popup:
#   - from within floax: detach (close the popup, session persists)
#   - otherwise: ensure the session exists, then open the floating popup.
bind -n M-p if -F '#{==:#{session_name},floax}' 'detach-client' {
  run-shell 'tmux has-session -t floax 2>/dev/null || tmux new-session -d -s floax -c "#{pane_current_path}"'
  set -gu @floax_bell
  display-popup -E -w 80% -h 80% -b rounded -T floax "env -u TMUX tmux attach-session -t floax"
}
