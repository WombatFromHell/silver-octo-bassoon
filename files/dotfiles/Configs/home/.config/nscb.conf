[prime]
--prefer-vk-device 1
export VK_DEVICE_FILTER=discrete
export DRI_PRIME=1

[tenfoot]
-f --adaptive-sync --xwayland-count 1 --force-grab-cursor -e

[fallback]
-f -w 1920 -h 1080 -W 1920 -H 1080 -r 60 --adaptive-sync

[wstd]
-f -w 3440 -h 1440 -W 3440 -H 1440 --adaptive-sync

[std]
-f -w 2560 -h 1440 -W 2560 -H 1440 --adaptive-sync

[sdl]
--backend=sdl
export SDL_VIDEODRIVER=x11

[hdr]
--hdr-enabled --hdr-itm-enabled
export DXVK_HDR=1
export PROTON_ENABLE_HDR=1

[fsr]
-F fsr --sharpness 0

[vsrSDD]
-f -w 1280 -h 720 -W 2560 -H 1440

[vsr4k]
-f -w 2560 -h 1440 -W 3840 -H 2160
