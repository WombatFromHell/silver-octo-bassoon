monitor.bluez.rules = [
  {
    matches = [{ node.name = "~bluez_output.*" }]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver  = 2000
      }
    }
  }
]
monitor.alsa.rules = [
  {
    matches = [{ node.name = "alsa_output.usb-SteelSeries_SteelSeries_Arctis_7-00.mono-chat" }]
    actions = {
      update-props = {
        priority.session = 500
        priority.driver  = 500
      }
    }
  }
]
