---
- name: Copy sudoers.d configs to /etc/sudoers.d
  tags: [extra, sudoers]
  ansible.builtin.include_tasks: install_configs.yml
  vars:
    src_path: "{{ role_path }}/files/sudoers.d"
    dest_dir: /etc/sudoers.d
    # Safety: a broken drop-in would lock everyone out of sudo, so validate before install.
    validate: visudo -cf %s
