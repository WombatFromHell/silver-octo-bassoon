---
# ponytail: legacy-binary purge — files/bin has no sources left, so this file only removes
# stale binaries. Delete it entirely once no host still has them.
- name: Purge legacy binaries from /usr/local/bin
  tags: [extra, globalbin]
  become: true
  block:
    - name: Ensure /usr/local/bin directory exists
      ansible.builtin.file:
        path: /usr/local/bin
        state: directory
        mode: "0755"

    - name: Remove deprecated binaries
      ansible.builtin.file:
        path: "/usr/local/bin/{{ item }}"
        state: absent
      loop: [nvidia-pm.py, veridian-controller, fix-wakeups.sh]
